[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bicm"
dynamic = ["version"]
description = "Bipartite configuration models: BiCM, weighted null models and validated projections of bipartite networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Matteo Bruno", email = "matteobruno180@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "numba>=0.56",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
# PyTorch null models for weighted networks (bicm.wbnm)
weighted = ["torch>=1.10"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mat701/BiCM"
Documentation = "https://bipartite-configuration-model.readthedocs.io/en/latest/"
Source = "https://github.com/mat701/BiCM"

[tool.setuptools.packages.find]
include = ["bicm*"]

[tool.setuptools.dynamic]
version = { attr = "bicm.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::numba.core.errors.NumbaExperimentalFeatureWarning",
]
